# Alternative to docker-compose.prod.yml for a VPS that ALREADY runs a
# Traefik reverse proxy (e.g. Hostinger's "Docker" VPS template ships one).
# No Caddy here — Traefik discovers these two containers via Docker labels
# and handles TLS itself, the same way it already routes any other app on
# the box. The existing Traefik service is untouched.
#
# The labels below assume a Traefik configured like Hostinger's default:
#   --providers.docker=true --providers.docker.exposedbydefault=false
#   --entrypoints.web.address=:80  --entrypoints.websecure.address=:443
#   --certificatesresolvers.letsencrypt.acme.httpchallenge=true
# If your Traefik's entrypoint or resolver names differ, check its
# docker-compose.yml (grep for --entrypoints./--certificatesresolvers.) and
# adjust `entrypoints=` / `certresolver=` below to match.
#
# Backend/frontend publish NO ports to the host — Traefik reaches them over
# the Docker network by container IP (it can do this from host network mode
# regardless of which bridge network they're on), the same isolation
# property docker-compose.prod.yml gets from Caddy being the only bound port.
#
# Usage (from this directory):
#   cp .env.example .env                          # fill in your domains
#   cp ../.env.example ../backend/.env             # fill in secrets — see DEPLOYMENT.md
#   docker compose -f docker-compose.traefik.yml up -d --build

services:
  backend:
    build: ../backend
    env_file:
      - ../backend/.env
    restart: unless-stopped
    expose:
      - "8000"
    # Join the mailserver's compose network IN ADDITION to this project's
    # default. The cold-email module's IMAP sync reads the org mailbox on
    # mail.atlasreach.io:993 — that host resolves to the VPS's PUBLIC IP, and
    # a container connecting back to its own host's public IP hits Docker's
    # hairpin-NAT limitation and hangs until timeout (verified live: DNS
    # resolves instantly, the TCP connect never completes). Being on the
    # mailserver network lets Docker's embedded DNS resolve mail.atlasreach.io
    # to the mailserver container's INTERNAL IP (172.18.x) instead, so the
    # IMAP connection is a direct container-to-container hop. This does NOT
    # expose the mailserver to anything new — only our own backend reaches it,
    # the same auth still applies. The mailserver stack stays a separate
    # compose project; we only attach to its already-existing network.
    networks:
      - default
      - mailserver
    labels:
      - traefik.enable=true
      - traefik.http.routers.salescale-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.salescale-api.entrypoints=websecure
      - traefik.http.routers.salescale-api.tls.certresolver=letsencrypt
      - traefik.http.services.salescale-api.loadbalancer.server.port=8000

  frontend:
    build:
      context: ../frontend
      args:
        # Baked into the static build — must be the API's public HTTPS URL.
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.salescale-app.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.salescale-app.entrypoints=websecure
      - traefik.http.routers.salescale-app.tls.certresolver=letsencrypt
      - traefik.http.services.salescale-app.loadbalancer.server.port=80

  # Exists ONLY so Traefik obtains + renews a Let's Encrypt cert for the mail
  # host — docker-mailserver (deploy/docker-compose.mailserver.yml, its own
  # compose project) reads that cert out of Traefik's acme.json for IMAPS.
  # Serves nothing sensitive; HTTPS requests to the mail hostname just get a
  # whoami echo. See MAILSERVER.md "TLS certificate".
  mail-cert-helper:
    image: traefik/whoami
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailcert.rule=Host(`${MAIL_DOMAIN:-mail.atlasreach.io}`)
      - traefik.http.routers.mailcert.entrypoints=websecure
      - traefik.http.routers.mailcert.tls.certresolver=letsencrypt
      - traefik.http.services.mailcert.loadbalancer.server.port=80

# `default` is this project's own bridge (deploy_default), created implicitly.
# `mailserver` is the docker-mailserver compose project's network, declared
# external so we ATTACH to it rather than manage it — see the backend service's
# `networks:` block above for why the IMAP path needs it.
networks:
  default:
  mailserver:
    external: true
    name: mailserver_default

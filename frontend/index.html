<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: installable to the iOS home screen (Safari → Share → Add to Home
         Screen), launches full-screen with its own icon. No service worker —
         the app is a live, server-backed dashboard, and iOS needs only the
         manifest + apple tags for a standalone home-screen app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f2147" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Salescale" />
    <!-- Fonts are Vite-bundled assets (src/assets/fonts) so their URLs stay
         relative and load under the desktop app's file:// origin; no static
         preload is possible against hashed filenames — font-display: swap
         covers first paint instead. -->
    <title>Salescale</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

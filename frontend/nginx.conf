server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (applied to the SPA document responses) ---
    # HSTS assumes TLS is terminated upstream (the common hosted setup). Tune
    # the CSP connect-src if the API is served from a different origin than this
    # host — by default it allows same-origin plus any HTTPS API.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # The SPA document must never be cached blind: with no Cache-Control,
    # browsers apply heuristic caching and can pin a user to a pre-deploy
    # bundle for hours after a release. `expires -1` emits
    # "Cache-Control: no-cache" (revalidate via ETag, cheap 304s) and — unlike
    # add_header — does not drop the inherited security headers above.
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted assets. A location with its own add_header
    # drops the inherited (server-level) ones, so re-assert nosniff here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
